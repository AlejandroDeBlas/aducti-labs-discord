services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aducti-labs-discord
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - APP_URL=http://localhost:3000
      - DATABASE_URL=postgres://postgres:postgres_password@postgres:5432/aducti_labs_discord
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_PRO_ID=${STRIPE_PRICE_PRO_ID}
      - STRIPE_PRICE_FOUNDER_ID=${STRIPE_PRICE_FOUNDER_ID}
      - SESSION_SECRET=${SESSION_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: aducti-labs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: aducti_labs_discord
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aducti_labs_discord"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
